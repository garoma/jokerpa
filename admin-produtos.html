<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos - Administração</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <main class="container">

    <h1>Produtos</h1>

    <section class="painel">

      <h2 id="titulo-form">Cadastrar produto</h2>

      <form id="form-produto">

        <input type="hidden" id="produto-id">

        <div class="grade-form">

          <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" required>
          </div>

          <div>
            <label for="categoria">Categoria</label>
            <select id="categoria" required>
              <option>Vestuário</option>
              <option>Acessórios</option>
              <option>Calçados</option>
              <option>Outros</option>
            </select>
          </div>

          <div>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>
          </div>

          <div>
            <label for="estoque">Quantidade em estoque</label>
            <input type="number" id="estoque" min="0" step="1" required>
          </div>

        </div>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" rows="2"></textarea>

        <label for="imagem">Foto (opcional)</label>
        <input type="file" id="imagem" accept="image/*">

        <div id="msg" class="msg"></div>

        <div style="margin-top: 18px; display: flex; gap: 10px;">
          <button type="submit" class="btn">Salvar produto</button>
          <button type="button" class="btn btn-claro" id="btn-cancelar" style="display:none;">Cancelar edição</button>
        </div>

      </form>

    </section>

    <section class="painel">

      <h2>Produtos cadastrados</h2>

      <div class="rolagem">
        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Estoque</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>

    </section>

  </main>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-produtos.js"></script>
</body>
</html>
