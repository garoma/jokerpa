<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Loja Reserva</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="tela-acesso">
    <div class="caixa-acesso">

      <h1>Entrar</h1>
      <p style="color: var(--suave); margin-top: 0;">
        Clientes e administrador entram por aqui.
      </p>

      <form id="form-login">

        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>

        <div id="msg" class="msg"></div>

        <button type="submit" class="btn btn-total">Entrar</button>

      </form>

      <p class="rodape">
        Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
      </p>

    </div>
  </main>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
