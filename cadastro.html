<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - Loja Reserva</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="tela-acesso">
    <div class="caixa-acesso">

      <h1>Criar conta</h1>

      <form id="form-cadastro">

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required>

        <label for="telefone">Telefone / WhatsApp</label>
        <input type="tel" id="telefone" required>

        <label for="usuario">Usuário (para entrar)</label>
        <input type="text" id="usuario" autocomplete="username" required>

        <label for="senha">Senha (mínimo 4 caracteres)</label>
        <input type="password" id="senha" autocomplete="new-password" minlength="4" required>

        <label for="confirmar">Repita a senha</label>
        <input type="password" id="confirmar" autocomplete="new-password" required>

        <div id="msg" class="msg"></div>

        <button type="submit" class="btn btn-total">Cadastrar</button>

      </form>

      <p class="rodape">
        Já tem conta? <a href="login.html">Entrar</a>
      </p>

    </div>
  </main>

  <script src="js/db.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
